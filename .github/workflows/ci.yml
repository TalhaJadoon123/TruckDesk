name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs: a fleet of stale checks costs more than it tells you.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # No `version:` here. The root package.json pins `packageManager`, and
      # specifying both makes pnpm/action-setup refuse to run with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--ignore-scripts` keeps esbuild and workerd from running their
      # postinstall hooks in CI; nothing here needs their native binaries.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Catches a manifest edited without a matching install. Both dependency
      # bugs this project hit - a dropped `postgres` and an added
      # `fastify-plugin` - compiled fine locally against a stale node_modules
      # and failed only in a clean checkout.
      - name: Check dependency parity
        run: node scripts/check-dependency-parity.mjs

      - name: Build libraries
        run: >-
          pnpm --filter @truckdesk/shared --filter @truckdesk/core
          --filter @truckdesk/eld --filter @truckdesk/loads
          --filter @truckdesk/llm --filter @truckdesk/sms
          --filter @truckdesk/integrations run build

      - name: Build API
        run: pnpm --filter @truckdesk/api run build

      - name: Typecheck API
        run: pnpm --filter @truckdesk/api exec tsc -p tsconfig.json --noEmit

      - name: Typecheck desktop
        run: pnpm --filter @truckdesk/desktop run typecheck

      # The web and docs tiers are full Next.js builds rather than typechecks:
      # a page can typecheck and still fail to prerender, which is exactly what
      # the docs build did when two front-matter descriptions contained ': '.
      - name: Build web
        run: pnpm --filter @truckdesk/web run build

      - name: Build docs
        run: pnpm --filter @truckdesk/docs run build

      - name: Unit tests
        run: pnpm test

      # Drives the real Fastify server through a full dispatcher session with
      # no sockets: book, parse an email, dispatch, track, deliver, invoice,
      # settle and calculate IFTA, including every refusal path.
      - name: End-to-end smoke
        run: pnpm --filter @truckdesk/api run smoke

      # Throws degenerate and hostile input at every exported surface. This is
      # the check that catches NaN leaking into a distance or a tenant-scoped
      # storage key escaping its prefix.
      - name: Adversarial probe
        run: pnpm --filter @truckdesk/api run probe

      - name: CSV parser probe
        run: pnpm --filter @truckdesk/api exec tsx src/probe-csv.ts

      - name: Seed smoke test
        run: pnpm --filter @truckdesk/api run seed

      # Exercises the running server rather than reading the source: auth on
      # every sensitive route, role separation, tenant isolation, token
      # forgery, error hygiene, SSRF surface and the credential lockout.
      - name: Security gate
        run: pnpm --filter @truckdesk/api run gate

      # The migrations must exist and be internally consistent. Executing them
      # needs a live Postgres, so the DB migration itself is a manual
      # pre-deploy step, recorded in docs/OPERATIONS.md.
      - name: Validate migrations
        run: node scripts/validate-migrations.mjs

      # A secret in the committed tree is a release blocker, not a warning.
      - name: Scan for committed secrets
        run: node scripts/scan-secrets.mjs

      - name: Audit dependencies
        # Advisory only: the esbuild advisory is dev-tooling only, and a hard
        # failure here would block a merge for something with no runtime impact.
        continue-on-error: true
        run: pnpm audit --audit-level=moderate